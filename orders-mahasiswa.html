<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - BBite</title>
    <link rel="stylesheet" href="style.css">
    <script src="security.js" data-guard></script>
    <style>
        .app-container.dashboard { background: #F6F7F9; }
        .mo-page { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 56px 18px 110px; }
        .mo-page::-webkit-scrollbar { display: none; }
        .mo-title { text-align: center; font-size: 20px; font-weight: 800; color: #1F2937; margin-bottom: 22px; }
        .mo-section { font-size: 14px; font-weight: 800; color: #1F2937; margin: 4px 0 12px 4px; }
        .mo-card { background: #FFF; border: 1px solid #E8EAED; border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(15,23,42,0.04); }
        .mo-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .mo-name { flex: 1; font-size: 16px; font-weight: 800; color: #1F2937; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mo-items { font-size: 13px; color: #4B5563; line-height: 1.55; margin-bottom: 10px; }
        .mo-target { display: flex; align-items: center; gap: 10px; background: #FFF1D6; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; color: #B07400; }
        .mo-target b { display: block; font-size: 12.5px; color: #4A3200; }
        .mo-target small { font-size: 11px; color: #8A6A1F; }
        .mo-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #EEF0F2; padding-top: 12px; }
        .mo-total { font-size: 16px; font-weight: 800; color: #1F2937; }
        .mo-btn { border: none; background: #F5A623; color: #3B2600; font-family: inherit; font-weight: 800; font-size: 13px; padding: 11px 20px; border-radius: 12px; cursor: pointer; text-decoration: none; display: inline-block; }
        .mo-btn.outline { background: #FFF; color: #1F2937; border: 1px solid #D1D5DB; font-weight: 700; padding: 10px 22px; }
        .mo-btn:active { transform: scale(0.97); }
        .mo-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px 60px; }
        .mo-empty h2 { font-size: 22px; font-weight: 800; color: #1F2937; margin: 18px 0 8px; }
        .mo-empty p { font-size: 13.5px; color: #6B7280; line-height: 1.55; margin-bottom: 26px; }
        .mo-empty .mo-btn { width: 100%; padding: 16px; font-size: 15px; border-radius: 14px; }
        .mo-skel { height: 150px; border-radius: 16px; margin-bottom: 14px; background: linear-gradient(90deg,#F0F1F3 25%,#F8F8F9 50%,#F0F1F3 75%); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
        @keyframes sh { to { background-position: -200% 0; } }
        .mo-more { text-align: center; font-size: 12px; color: #9CA3AF; margin-top: 4px; }
    </style>
    <style id="sharedCss"></style>
</head>
<body>
    <div class="app-container dashboard">
        <div class="mo-page" id="page">
            <h1 class="mo-title">My Orders</h1>
            <div id="content"><div class="mo-skel"></div><div class="mo-skel"></div></div>
        </div>

        <nav class="bottom-nav">
            <a href="home-mahasiswa.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                <span>Home</span>
            </a>
            <a href="orders-mahasiswa.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
                <span>Order</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script type="module">
        import { db, waitUser, rp, esc, toMs, isVisible, stageOf, merchantInfo, logoHTML, SVG, SHARED_CSS } from "./order-utils.js";
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        document.getElementById("sharedCss").textContent = SHARED_CSS;
        const content = document.getElementById("content");
        const HISTORY_LIMIT = 10;

        const EMPTY_HTML = `
            <div class="mo-empty">
                <svg width="150" height="130" viewBox="0 0 150 130" fill="none" stroke="#F5A623" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="78" cy="118" rx="38" ry="5" fill="#EEE" stroke="none"/>
                    <path d="M42 50h72l6 62a4 4 0 0 1-4 4H40a4 4 0 0 1-4-4z" fill="#FFF8EA"/>
                    <path d="M62 50V40a16 16 0 0 1 32 0v10"/>
                    <circle cx="78" cy="84" r="13" stroke="#BDBDBD"/><circle cx="78" cy="84" r="6" stroke="#BDBDBD"/>
                    <path d="M120 24l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#FFF1D6"/>
                    <path d="M28 40v8M24 44h8" stroke="#D1D5DB"/><circle cx="26" cy="72" r="2" fill="#F5A623" stroke="none"/>
                </svg>
                <h2>No Orders Yet</h2>
                <p>You haven't placed any orders yet. Discover delicious food from campus canteens!</p>
                <a class="mo-btn" href="home-mahasiswa.html?view=canteens">Browse Canteens</a>
            </div>`;

        const itemsText = (o) => (o.items || []).map(i => `<div>${Number(i.qty) || 1}x ${esc(i.name)}</div>`).join("");

        function reorderHref(o, info) {
            const id = String(o.merchantId || "");
            return "menu-kantin.html?resto=" + encodeURIComponent(info.name) + (id.length >= 20 ? "&uid=" + encodeURIComponent(id) : "");
        }

        function activeCard(o, info, st) {
            const when = o.type === "Pickup" ? "Pickup time" : "Target Delivery";
            const hint = o.type === "Pickup" ? "(Class End Slot)" : "(Class End Slot)";
            const target = o.time ? `<div class="mo-target">${SVG.clock}<div><b>${when}: ${esc(o.time)}</b><small>${hint}</small></div></div>` : "";
            return `
            <div class="mo-card">
                <div class="mo-top">${logoHTML(info, 40)}<div class="mo-name">${esc(info.name)}</div><span class="mo-badge ${st.tone}">${st.label}</span></div>
                <div class="mo-items">${itemsText(o)}</div>
                ${target}
                <div class="mo-foot"><span class="mo-total">${rp(o.totalPrice)}</span><a class="mo-btn" href="track-order.html?id=${encodeURIComponent(o._id)}">Track Order</a></div>
            </div>`;
        }
        function historyCard(o, info, st) {
            return `
            <div class="mo-card">
                <div class="mo-top">${logoHTML(info, 40)}<div class="mo-name">${esc(info.name)}</div><span class="mo-badge ${st.tone}">${st.label}</span></div>
                <div class="mo-items">${itemsText(o)}</div>
                <div class="mo-foot"><span class="mo-total">${rp(o.totalPrice)}</span><a class="mo-btn outline" href="${reorderHref(o, info)}">Reorder</a></div>
            </div>`;
        }

        let latest = [];
        let renderSeq = 0;
        async function render() {
            const seq = ++renderSeq;
            const list = latest.filter(isVisible).sort((a, b) => toMs(b.timestamp) - toMs(a.timestamp));
            if (!list.length) { content.innerHTML = EMPTY_HTML; return; }

            const infos = await Promise.all(list.map(merchantInfo));
            if (seq !== renderSeq) return; // ada pembaruan yang lebih baru

            const active = [], history = [];
            list.forEach((o, i) => {
                const st = stageOf(o);
                (st.final ? history : active).push({ o, info: infos[i], st });
            });

            let html = "";
            if (active.length) html += `<div class="mo-section">Active Orders</div>` + active.map(x => activeCard(x.o, x.info, x.st)).join("");
            if (history.length) {
                html += `<div class="mo-section" style="margin-top:${active.length ? 22 : 4}px">Recent History</div>`
                      + history.slice(0, HISTORY_LIMIT).map(x => historyCard(x.o, x.info, x.st)).join("");
                if (history.length > HISTORY_LIMIT) html += `<div class="mo-more">Showing the latest ${HISTORY_LIMIT} orders</div>`;
            }
            content.innerHTML = html;
        }

        (async () => {
            const user = await waitUser();
            if (!user) { window.location.href = "index.html"; return; }
            // Hanya pesanan milik akun ini. Diurutkan di browser supaya tidak perlu index Firestore tambahan.
            onSnapshot(query(collection(db, "orders"), where("studentId", "==", user.uid)), (snap) => {
                latest = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
                render();
            }, (err) => {
                console.error(err);
                content.innerHTML = '<div class="mo-empty"><h2>Could not load orders</h2><p>' + esc(err.message) + '</p></div>';
            });
        })();
    </script>
</body>
</html>
