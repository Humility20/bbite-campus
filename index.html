<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Desain Custom Alert Modal */
        .custom-alert-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            display: none; justify-content: center; align-items: center;
            padding: 24px; backdrop-filter: blur(3px);
        }
        .custom-alert-box {
            background: #FFFFFF; width: 100%; border-radius: 20px;
            padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; text-align: center; gap: 12px;
        }
        .custom-alert-box h3 { font-size: 18px; color: #000; font-weight: 700; margin: 0; }
        .custom-alert-box p { font-size: 13px; color: #666; margin: 0; margin-bottom: 12px; line-height: 1.5; }
        .btn-alert-ok {
            background: #DC9808; color: #FFF; font-weight: 700; font-size: 14px;
            padding: 14px; border-radius: 12px; border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-alert-ok:active { transform: scale(0.96); opacity: 0.9; }

        /* ==== DESAIN BARU: Sign In (scoped khusus halaman ini) ==== */
        .app-container { background-color: #FFFFFF; }
        .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
        .auth-brand-icon { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
        .auth-brand-name { font-size: 20px; font-weight: 800; color: #DC9808; }

        .auth-heading { font-size: 24px; font-weight: 700; color: #000; margin-bottom: 6px; }
        .auth-subtext { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 24px; }
        .auth-subtext strong { color: #333; }

        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label { font-size: 12px; font-weight: 600; color: #333; }
        .auth-input { position: relative; display: flex; align-items: center; background: #F5F5F5; border-radius: 14px; padding: 0 14px; transition: 0.2s; }
        .auth-input:focus-within { background: #FFF; box-shadow: 0 0 0 2px #DC9808; }
        .auth-input input { flex: 1; border: none; background: transparent; padding: 15px 8px; font-size: 14px; outline: none; }
        .auth-input input::placeholder { color: #A0A0A0; }
        .auth-input-icon-left { color: #A0A0A0; display: flex; align-items: center; }
        .auth-input-icon-right { color: #A0A0A0; display: flex; align-items: center; cursor: pointer; }

        .auth-forgot { display: block; text-align: right; font-size: 12px; color: #DC9808; font-weight: 600; text-decoration: none; }

        .auth-submit { width: 100%; padding: 16px; border-radius: 30px; background: #DC9808; color: #FFF; font-size: 15px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; margin-top: auto; margin-bottom: 24px; }
        .auth-submit:active { transform: scale(0.97); opacity: 0.9; }

        .auth-footer { text-align: center; font-size: 12px; color: #666; padding-bottom: 10px; }
        .auth-footer a { color: #DC9808; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="app-container">

        <div class="auth-brand">
            <img src="logo.jpg" alt="BBite" class="auth-brand-icon">
            <span class="auth-brand-name">BBite</span>
        </div>

        <h1 class="auth-heading">Welcome back!</h1>
        <p class="auth-subtext">Ready to order your favorite food in <strong>Kampus Anggrek</strong> today?</p>

        <form id="loginForm">
            <div class="auth-field">
                <label>Email</label>
                <div class="auth-input">
                    <span class="auth-input-icon-left">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
                    </span>
                    <input type="email" id="loginEmail" placeholder="e.g. xxx@binus.ac.id" required>
                </div>
            </div>

            <div class="auth-field">
                <label>Password</label>
                <div class="auth-input">
                    <span class="auth-input-icon-left">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                    </span>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <span class="auth-input-icon-right toggle-password">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <a href="forgot.html" class="auth-forgot">Forgot Password?</a>

            <button type="submit" class="auth-submit" id="btnLogin">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </p>

        <!-- CUSTOM ALERT MODAL -->
        <div class="custom-alert-overlay" id="customAlertOverlay">
            <div class="custom-alert-box">
                <div id="alertIcon" style="font-size: 32px; margin-bottom: 8px;">⏳</div>
                <h3 id="alertTitle">Pemberitahuan</h3>
                <p id="alertMessage">Pesan akan muncul di sini.</p>
                <button class="btn-alert-ok" onclick="closeCustomAlert()">OK</button>
            </div>
        </div>

    </div>

    <!-- SCRIPT UI -->
    <script>
        const togglePasswordIcons = document.querySelectorAll('.toggle-password');
        togglePasswordIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const inputField = this.previousElementSibling;
                if (inputField.type === 'password') {
                    inputField.type = 'text'; this.style.color = '#DC9808'; 
                } else {
                    inputField.type = 'password'; this.style.color = '#A0A0A0'; 
                }
            });
        });

        // Fungsi Custom Alert pengganti window.alert()
        function showCustomAlert(title, message, emoji = '⏳', isError = false) {
            document.getElementById("alertTitle").innerText = title;
            document.getElementById("alertMessage").innerText = message;
            document.getElementById("alertIcon").innerText = emoji;
            
            const btn = document.querySelector(".btn-alert-ok");
            btn.style.background = isError ? "#D32F2F" : "#DC9808";
            
            document.getElementById("customAlertOverlay").style.display = "flex";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertOverlay").style.display = "none";
        }

        // Tampilkan pesan dari halaman sign up (sekali saja), lalu hapus
        try {
            const raw = sessionStorage.getItem("bbite_notice");
            if (raw) {
                sessionStorage.removeItem("bbite_notice");
                const n = JSON.parse(raw);
                showCustomAlert(n.title, n.message, n.emoji, false);
            }
        } catch (e) {}
    </script>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCd_v_YnSXpiVAA_eDxk_MaCCdqo4H5CFE",
          authDomain: "bbite-ac7e4.firebaseapp.com",
          projectId: "bbite-ac7e4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("loginForm").addEventListener("submit", function(event){
            event.preventDefault();
            document.getElementById("btnLogin").innerText = "Checking...";
            
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            // Admin Shortcut
            if (email === "adminBBite@ac.id" && password === "admin123") {
                localStorage.setItem("bbite_admin_session", "active");
                window.location.href = "admin.html";
                return; 
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    const uid = userCredential.user.uid;
                    
                    // Cek role di Firestore
                    const docSnap = await getDoc(doc(db, "users", uid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        if (data.status === "pending") {
                            showCustomAlert(
                                "Menunggu Persetujuan", 
                                "Akun Merchant Anda sedang dalam proses peninjauan oleh Admin. Harap bersabar.", 
                                "⏳", false
                            );
                            signOut(auth);
                            document.getElementById("btnLogin").innerText = "Sign In";
                        } else if (data.status === "suspended") {
                            showCustomAlert(
                                "Akun Ditangguhkan", 
                                "Mohon maaf, akun Anda saat ini ditangguhkan oleh Admin karena alasan tertentu.", 
                                "🚫", true
                            );
                            signOut(auth);
                            document.getElementById("btnLogin").innerText = "Sign In";
                        } else {
                            // Smart Routing
                            if (data.role === "Merchant") {
                                window.location.href = "home-merchant.html";
                            } else {
                                window.location.href = "home-mahasiswa.html";
                            }
                        }
                    } else {
                        window.location.href = "home-mahasiswa.html"; // Fallback
                    }
                })
                .catch((error) => {
                    showCustomAlert(
                        "Gagal Masuk", 
                        "Email atau kata sandi yang Anda masukkan salah. Silakan coba lagi.", 
                        "⚠️", true
                    );
                    document.getElementById("btnLogin").innerText = "Sign In";
                });
        });
    </script>
</body>
</html>
